plugins {
    id 'java-library'
}

group = 'com.automation'
version = '1.0.0'

sourceCompatibility = '17'
targetCompatibility = '17'

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Appium
    implementation 'io.appium:java-client:8.6.0'

    // Selenium (must be <4.14 for Appium java-client 8.6.0 compatibility)
    implementation 'org.seleniumhq.selenium:selenium-java:4.13.0'

    // TestNG
    implementation 'org.testng:testng:7.10.2'

    // Allure TestNG
    implementation 'io.qameta.allure:allure-testng:2.27.0'

    // Logging
    implementation 'org.apache.logging.log4j:log4j-core:2.24.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.24.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.0'
    implementation 'org.slf4j:slf4j-api:2.0.13'

    // JSON
    implementation 'com.google.code.gson:gson:2.11.0'

    // AspectJ for Allure
    implementation 'org.aspectj:aspectjweaver:1.9.22'
}

test {
    useTestNG {
        suiteXmlFiles = [file('testng.xml')]
    }

    systemProperty 'allure.results.directory', "${buildDir}/allure-results"
}
